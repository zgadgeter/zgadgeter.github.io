<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Share a Memory of Ray</title>
    <meta name="description" content="Share a memory or leave a message in memory of Ray Henry Johnson, Jr.">
    <style>
        html, body { margin: 0; background: #000; color: #f5f5f7; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 32px 16px 48px; }
        .wrap { max-width: 720px; margin: 0 auto; }
        .back { display: inline-block; margin-bottom: 28px; color: #a1a1a6; text-decoration: none; letter-spacing: 1px; font-size: .95rem; }
        .back:hover { color: #fff; }
        header { text-align: center; margin-bottom: 32px; }
        header .portrait { width: 120px; height: 120px; margin: 0 auto; border-radius: 50%; border: 1px solid #333; background: url("Ray_Memorial.jpg") 60% 19% / 220% auto no-repeat; }
        h1 { font-weight: 300; letter-spacing: 2px; margin: 18px 0 10px; font-size: 1.8rem; }
        .intro { color: #a1a1a6; line-height: 1.6; margin: 0 auto; max-width: 560px; }

        /* Form */
        form { background: #0d0d0d; border: 1px solid #222; border-radius: 12px; padding: 22px; }
        label { display: block; font-size: .85rem; color: #a1a1a6; letter-spacing: .5px; margin: 0 0 6px; }
        .row { margin-bottom: 16px; }
        .two { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
        @media (max-width: 560px) { .two { grid-template-columns: 1fr; gap: 0; } }
        input, textarea {
            width: 100%; box-sizing: border-box; background: #000; color: #f5f5f7;
            border: 1px solid #333; border-radius: 8px; padding: 11px 12px;
            font: inherit; font-size: 1rem; transition: border-color .2s;
        }
        input:focus, textarea:focus { outline: none; border-color: #8e8e93; }
        textarea { min-height: 150px; resize: vertical; line-height: 1.55; }
        .hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
        .actions { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
        .hint { font-size: .8rem; color: #6e6e73; }
        button {
            padding: 11px 26px; background: #f5f5f7; color: #000; border: 0; border-radius: 999px;
            font: inherit; font-size: 1rem; letter-spacing: 1px; cursor: pointer; transition: opacity .2s;
        }
        button:disabled { opacity: .5; cursor: default; }
        .status { margin: 14px 0 0; font-size: .95rem; line-height: 1.5; min-height: 1.2em; }
        .status.ok { color: #c7e6c1; }
        .status.err { color: #ffb4a8; }

        /* Memories */
        h2 { font-weight: 300; letter-spacing: 1.5px; font-size: 1.25rem; text-align: center; margin: 48px 0 20px; color: #d2d2d7; }
        .memory { border-top: 1px solid #1f1f1f; padding: 22px 4px; }
        .memory p { margin: 0 0 12px; line-height: 1.7; white-space: pre-wrap; color: #e5e5ea; }
        .memory .by { font-size: .88rem; color: #8e8e93; }
        .memory .by strong { color: #d2d2d7; font-weight: 500; }
        .empty { text-align: center; color: #6e6e73; }
        footer { text-align: center; margin-top: 40px; font-size: .75rem; }
        footer a { color: #6e6e73; text-decoration: none; }
    </style>
</head>
<body>
<div class="wrap">

    <a class="back" href="index.html">&larr; Back</a>

    <header>
        <div class="portrait" role="img" aria-label="Ray as a boy"></div>
        <h1>Share a Memory of Ray</h1>
        <p class="intro">
            A story, a moment you shared, or simply a few words. Messages appear here
            once the family has read them.
        </p>
    </header>

    <form id="memoryForm" novalidate>
        <div class="two">
            <div class="row">
                <label for="name">Your name</label>
                <input id="name" name="name" maxlength="80" autocomplete="name" required>
            </div>
            <div class="row">
                <label for="relation">How you knew Ray <span style="color:#6e6e73">(optional)</span></label>
                <input id="relation" name="relation" maxlength="100" placeholder="e.g. school friend, cousin">
            </div>
        </div>
        <div class="row">
            <label for="message">Your memory or message</label>
            <textarea id="message" name="message" maxlength="3000" required></textarea>
        </div>
        <div class="hp" aria-hidden="true">
            <label for="website">Leave this empty</label>
            <input id="website" name="website" tabindex="-1" autocomplete="off">
        </div>
        <div class="actions">
            <span class="hint">Your message is read by the family before it is shown.</span>
            <button type="submit" id="send">Send</button>
        </div>
        <p class="status" id="status" role="status" aria-live="polite"></p>
    </form>

    <h2>Memories of Ray</h2>
    <div id="memories"><p class="empty">Loading…</p></div>

    <footer><a href="privacy.html">Privacy / Datenschutz</a></footer>
</div>

<script>
(function () {
    var API = "https://ray-candles.zgadgeter.workers.dev";

    var form = document.getElementById("memoryForm");
    var statusEl = document.getElementById("status");
    var sendBtn = document.getElementById("send");
    var list = document.getElementById("memories");

    function setStatus(text, kind) { statusEl.textContent = text; statusEl.className = "status " + (kind || ""); }

    function render(memories) {
        list.textContent = "";
        if (!memories.length) {
            var p = document.createElement("p"); p.className = "empty";
            p.textContent = "Be the first to share a memory of Ray.";
            list.appendChild(p); return;
        }
        memories.forEach(function (m) {
            var div = document.createElement("article"); div.className = "memory";
            var msg = document.createElement("p"); msg.textContent = m.message;
            var by = document.createElement("div"); by.className = "by";
            var who = document.createElement("strong"); who.textContent = m.name;
            by.appendChild(document.createTextNode("— ")); by.appendChild(who);
            var extra = [];
            if (m.relation) extra.push(m.relation);
            try { extra.push(new Date(m.date).toLocaleDateString("en-US", { month: "long", year: "numeric" })); } catch (e) {}
            if (extra.length) by.appendChild(document.createTextNode(", " + extra.join(" · ")));
            div.appendChild(msg); div.appendChild(by); list.appendChild(div);
        });
    }

    fetch(API + "/memories").then(function (r) { return r.json(); })
        .then(function (d) { render(d.memories || []); })
        .catch(function () { list.innerHTML = '<p class="empty">Memories could not be loaded right now.</p>'; });

    form.addEventListener("submit", function (e) {
        e.preventDefault();
        var data = {
            name: form.name.value.trim(),
            relation: form.relation.value.trim(),
            message: form.message.value.trim(),
            website: form.website.value
        };
        if (!data.name || !data.message) { setStatus("Please enter your name and a message.", "err"); return; }
        sendBtn.disabled = true; setStatus("Sending…");
        fetch(API + "/memories", {
            method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(data)
        }).then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
          .then(function (res) {
              if (res.ok) {
                  form.reset();
                  setStatus("Thank you. Your memory has been received and will appear here once the family has read it.", "ok");
              } else {
                  setStatus(res.d.error || "Something went wrong. Please try again.", "err");
              }
          })
          .catch(function () { setStatus("Your message could not be sent. Please try again in a moment.", "err"); })
          .then(function () { sendBtn.disabled = false; });
    });
})();
</script>
</body>
</html>
