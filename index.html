<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ray Henry Johnson - Photo Gallery</title>
    <style>
        body { font-family: sans-serif; background: #1a1a1a; color: #fff; text-align: center; padding: 40px 20px; }
        h1 { margin-bottom: 30px; font-weight: 300; }
        .gallery { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; max-width: 1200px; margin: 0 auto; }
        .gallery a { border: 4px solid #fff; box-shadow: 0 4px 10px rgba(0,0,0,0.3); transition: transform 0.2s, box-shadow 0.2s; border-radius: 4px; overflow: hidden; }
        .gallery a:hover { transform: scale(1.04); box-shadow: 0 6px 15px rgba(255,255,255,0.2); }
        .gallery img { width: 300px; height: 200px; object-fit: cover; display: block; }
    </style>
</head>
<body>
    <h1>Photo Gallery</h1>
    <div class="gallery">
        <!-- Repeat the blocks below for your photos. Swap out the filenames to match your pictures exactly -->
        <a href="photo1.jpg" target="_blank"><img src="photo1.jpg" alt="Image 1"></a>
        <a href="photo2.jpg" target="_blank"><img src="photo2.jpg" alt="Image 2"></a>
    </div>
</body>
</html>
